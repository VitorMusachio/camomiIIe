name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=camomiIIe&show_icons=true&theme=transparent&hide_border=true&rank_icon=github&title_color=E91E8C&icon_color=E91E8C&text_color=8C8AA8&ring_color=E91E8C
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=camomiIIe&layout=compact&theme=transparent&hide_border=true&title_color=E91E8C&text_color=8C8AA8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Organization logos
        run: |
          mkdir -p profile
          curl -fsSL "https://github.com/itau.png?size=96" -o "profile/org-itau.png"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "Update profile cards" || exit 0
          git push
